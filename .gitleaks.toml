# Gitleaks configuration (A10): extend the default rules and allowlist the
# two known false positives. Both matches are *idempotency keys* for the
# revocation outbox (A6 contract field `idempotency_key`), not API
# credentials: one in a unit test fixture string, one in the A5 spec prose.
# Everything else keeps the default gitleaks rules.
[extend]
useDefault = true

[allowlist]
description = "Idempotency-key fixtures/spec prose, and A10's fabricated dummy secrets"
paths = [
  '''apps/api/tests/unit/test_outbox_worker\.py''',
  '''docs/work-packages/A5_RULE_ENGINE_AND_EVALUATION\.md''',
  # tests/security/test_log_redaction.py exists to fabricate dummy secret
  # values ("dummy-key-secret-...", etc.) and prove they never reach logs;
  # its own fixtures are not credentials.
  '''apps/api/tests/security/test_log_redaction\.py''',
]
